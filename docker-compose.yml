services:
  webcommerce:
    container_name: meetha
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        SECRET_KEY: ${SECRET_KEY}
    image: azarnuzy/meetha:latest # Set the image name here
    env_file:
      - .env
    ports:
      - '3000:3000'
    restart: unless-stopped
    networks:
      - webcommerce_network

networks:
  webcommerce_network:
    driver: bridge
