# Production stack for the VPS, deployed by .github/workflows/deploy.yml.
# .env.production lives only on the server; its VITE_* values are baked in at
# build time.
name: lind-web

services:
  web:
    container_name: lind-web
    build: .
    image: lind-web:latest
    restart: unless-stopped
    ports: ['127.0.0.1:18080:4780']
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    mem_limit: 128m
